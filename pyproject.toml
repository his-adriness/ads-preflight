[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ads-preflight"
version = "0.1.0"
description = "Preflight checks for ad-platform MCP servers: lint tools, test behaviour, gate agent actions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Castrillo" }]
keywords = ["mcp", "model-context-protocol", "advertising", "ai-agents", "safety", "lint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2,<3",
    "typer>=0.12",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/his-adriness/ads-preflight"
Repository = "https://github.com/his-adriness/ads-preflight"
Issues = "https://github.com/his-adriness/ads-preflight/issues"

[project.scripts]
ads-preflight = "ads_preflight.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_preflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
