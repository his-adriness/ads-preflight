[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-doctor"
version = "0.1.0"
description = "A checkup for MCP servers: inspect, test and lint."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Castrillo" }]
keywords = ["mcp", "model-context-protocol", "testing", "lint", "inspector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2,<3",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
fuzz = ["hypothesis>=6"]

[project.urls]
Homepage = "https://github.com/his-adriness/mcp-doctor"
Repository = "https://github.com/his-adriness/mcp-doctor"
Issues = "https://github.com/his-adriness/mcp-doctor/issues"

[project.scripts]
mcp-doctor = "mcpdoctor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpdoctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
